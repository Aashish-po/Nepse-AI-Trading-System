name: Nepse Data Auto Scrape

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 10 * * *'  # 4:00 PM Nepal Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r nepse_data/requirements.txt

      - name: Execute Scraping Script
        run: |
          python nepse_data/scraper.py --today --source all

      - name: Commit and Push Files
        run: |
          git config --local user.email "poudelashish572@gmail.com"
          git config --local user.name "aashishpaudel"

          git add nepse_data/data || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: NEPSE data scraped (today)"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi