[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "integration: integration tests",
]


# -----------------------------------
# ✅ Ruff Configuration
# -----------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "migrations",
    "alembic",
    "node_modules",
    "dist",
    "build",
]

# ✅ ADD THIS (important)
extend-exclude = [
    "research/notebooks",
    "*.ipynb"
]

fix = true
show-fixes = true


# -----------------------------------
# ✅ Lint Rules
# -----------------------------------
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # imports (important)
    "UP",  # pyupgrade
    "B",   # bugbear
]

ignore = [
    "E501",   # line length handled separately
    "B008",   # FastAPI dependency injection
]

dummy-variable-rgx = "^_.*"


# -----------------------------------
# ✅ Import Sorting (fixes your CI issue)
# -----------------------------------
[tool.ruff.lint.isort]

combine-as-imports = true

known-first-party = ["backend"]
known-third-party = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "numpy",
    "pandas",
    "pyarrow",
]

section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]


# -----------------------------------
# ✅ Formatter (Black-like style)
# -----------------------------------
[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# -----------------------------------
# ✅ Per-file Relaxations
# -----------------------------------
[tool.ruff.lint.per-file-ignores]

# Tests can be flexible
"tests/*" = ["ARG", "S101"]
"backend/tests/*" = ["ARG", "S101"]

# Ignore noise in migrations
"migrations/*" = ["E501", "F401"]
"alembic/*" = ["E501", "F401"]


[tool.pylance]
pythonPath = "backend"
pythonVersion = "3.11"

[tool.pyright]
extraPaths = ["backend"]
pythonVersion = "3.11"
pythonPlatform = "Windows"

[tool.mypy]
pythonVersion = "3.11"
mypy_path = "backend"
ignore_missing_imports = true
check_untyped_defs = true


