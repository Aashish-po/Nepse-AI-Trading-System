apiVersion: v1
kind: ConfigMap
metadata:
  name: nepse-ai-config
  namespace: nepse-ai
data:
  APP_ENV: "prod"
  APP_NAME: "NEPSE AI Trading Research Platform"
  APP_VERSION: "2.0.0"
  MLFLOW_ENABLED: "true"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  REDIS_URL: "redis://redis:6379/0"
  DATA_TRUST_SCORE_MINIMUM: "0.90"
---
# Secrets are templated here for reference. In a real cluster, create them with
# `kubectl create secret generic nepse-ai-secrets ...` or an external secrets
# operator — never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: nepse-ai-secrets
  namespace: nepse-ai
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_REAL_SECRET"
  DATABASE_URL: "postgresql+psycopg://nepse:REPLACE_ME@postgres:5432/nepse_ai"
