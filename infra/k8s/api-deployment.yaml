apiVersion: apps/v1
kind: Deployment
metadata:
  name: nepse-ai-api
  namespace: nepse-ai
  labels:
    app: nepse-ai-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nepse-ai-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nepse-ai-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/aashish-po/nepse-ai-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nepse-ai-config
            - secretRef:
                name: nepse-ai-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nepse-ai-api
  namespace: nepse-ai
  labels:
    app: nepse-ai-api
spec:
  selector:
    app: nepse-ai-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
