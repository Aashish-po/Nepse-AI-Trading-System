services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  dashboard:
    build:
      context: ..
      dockerfile: infra/docker/dashboard.Dockerfile
    env_file:
      - ../.env
    ports:
      - "8501:8501"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nepse_ai
      POSTGRES_USER: nepse
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

volumes:
  postgres_data:

