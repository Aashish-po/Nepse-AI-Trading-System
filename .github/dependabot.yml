# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (managed via uv: pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker base images
  - package-ecosystem: "docker"
    directories:
      - "/infra/docker"
    schedule:
      interval: "weekly"
    ignore:
      # Pin the Python base image to the 3.12 line. New Python minors
      # (3.13/3.14/...) routinely ship before the scientific stack
      # (pandas/numpy/scipy/xgboost) publishes matching wheels, which
      # breaks the slim-image build (no compiler -> source builds fail).
      # Bump this deliberately once wheels exist for the target version.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
