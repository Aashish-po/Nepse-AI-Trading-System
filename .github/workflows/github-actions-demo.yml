name: Run RiskManager Test

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Debug (important for path issues)
      - name: Debug paths
        run: |
          pwd
          ls -R
          python -c "import sys; print(sys.path)"

      # ✅ Run your RiskManager test
      - name: Test RiskManager
        run: |
          export PYTHONPATH=$(pwd)
          python -c "from ml.risk_management import RiskManager; rm = RiskManager(); print(rm.max_drawdown)"