name: Dependency Review

# Flags known-vulnerable or disallowed-license dependencies introduced in a PR
# before they reach main. Complements CodeQL (which scans our own code, not deps).

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
