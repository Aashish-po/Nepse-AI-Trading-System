name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest backend/tests/ -v
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: API import smoke test
        run: |
          python -c "from app.main import create_app; app = create_app(); print('App title:', app.title)"
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: ML module import smoke test
        run: |
          python -c "from ml.risk_manager import RiskManager; rm = RiskManager(); print('Max drawdown:', rm.max_drawdown)"
        env:
          PYTHONPATH: ${{ github.workspace }}