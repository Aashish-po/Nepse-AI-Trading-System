name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (from backend/)
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: API import smoke test
        run: |
          python -c "from app.main import create_app; app = create_app(); print('✅ App OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: ML module smoke test
        run: |
          python -c "from ml.risk_manager import RiskManager; print('✅ RiskManager OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Market calendar smoke test
        run: |
          python -c "from app.services.market_calendar import MarketCalendar; MarketCalendar(api_key=''); print('✅ MarketCalendar OK')"
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Type Check (Mypy)
        run: mypy backend/ --ignore-missing-imports --explicit-package-bases 

