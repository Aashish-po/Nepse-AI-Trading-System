name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      #  Checkout (updated)
      - name: Checkout
        uses: actions/checkout@v5

      #  Python setup (updated)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      #  Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      #  Ruff autofix (runs FIRST)
      - name: Ruff autofix
        run: ruff check . --fix

      #  Ruff lint (strict check)
      - name: Ruff lint
        run: ruff check .

      #  Format check (clean code enforcement)
      - name: Ruff format check
        run: ruff format --check .

      #  Run tests
      - name: Test
        run: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}

      #  API import smoke test
      - name: API import smoke check
        run: python -c "from backend.app.main import app; print(app.title)"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .